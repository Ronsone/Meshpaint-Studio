<!doctype html>
<html lang="nl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meshpaint Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#15161d;color:#eef0fa;font:14px system-ui,sans-serif}button,select,input{font:inherit}button,select{background:#2a2c39;color:inherit;border:1px solid #414354;border-radius:8px;padding:8px;cursor:pointer}button:hover,button.active{border-color:#bb9aff;background:#40345a}button:disabled{opacity:.45}.primary{background:#b89aff;color:#1c1330;font-weight:bold}header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px;border-bottom:1px solid #363849}header strong{font-size:20px;margin-right:auto}header strong span,a{color:#c4a7ff}main{display:grid;grid-template-columns:95px minmax(0,1fr) 245px;height:calc(100dvh - 111px);min-height:320px}nav,aside{padding:12px;background:#1e202a;overflow:auto}nav button{width:100%;margin-bottom:5px}section{position:relative;min-width:0;background:radial-gradient(ellipse at 50% 45%,#3b4053,#171922 75%)}canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}.overlay{position:absolute;top:12px;left:12px;background:#21232ee0;padding:8px 12px;border-radius:8px;pointer-events:none}.camera{position:absolute;bottom:12px;right:12px}h2{font-size:14px;margin:0 0 10px}hr{border:0;border-top:1px solid #383a48;margin:16px 0}label{display:block;margin:8px 0;color:#ccd0e1}input[type=range],select{width:100%;accent-color:#c4a7ff}.row{display:flex;align-items:center;gap:6px;margin:6px 0}.row .layer{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.swatches{display:flex;flex-wrap:wrap;gap:5px}.swatches button{width:24px;height:24px;padding:0}.swatches button.active{outline:2px solid white}small,footer{color:#c2c6d9}footer{padding:8px 12px}#saved a{display:inline-block;margin:0 0 8px}#saved a[hidden]{display:none}@media(max-width:680px){main{grid-template-columns:66px minmax(0,1fr) 142px}nav,aside{padding:6px}nav button{font-size:10px}header strong{font-size:16px}header button{font-size:11px}}
</style>
<header><strong>Meshpaint <span>Studio</span></strong><button id="open">STL / project openen</button><button id="save">Project opslaan</button><button id="export" class="primary">3MF exporteren</button><input id="file" type="file" accept=".stl,.meshpaint" hidden></header>
<main>
<nav aria-label="Gereedschap">
<button data-tool="brush" title="Penseel (B)">Penseel</button><button data-tool="fill" title="Vullen (G)">Vullen</button><button data-tool="erase" title="Gum (E)">Gum</button><button data-tool="pick" title="Pipet (I)">Pipet</button><button data-tool="orbit" title="Draaien (V)">Draaien</button><hr><button id="undo">Ongedaan</button><button id="redo">Opnieuw</button>
</nav>
<section id="view"><canvas aria-label="Schilderbaar 3D-model"></canvas><div class="overlay"><strong id="name"></strong><br><small id="count"></small></div><button class="camera" id="camera" title="Rechts slepen om te draaien, scrollen om te zoomen">Weergave herstellen</button></section>
<aside>
<h2>Kleur</h2><div class="row"><input id="color" type="color" value="#b095ff" aria-label="Verfkleur"><strong id="hex"></strong></div><div class="swatches" id="swatches"></div>
<label for="mix">Mengkleuren</label><div class="row"><button id="paletteOpen">Palet importeren</button><button id="example" title="CSV-voorbeeld downloaden">CSV</button></div><input id="paletteFile" type="file" accept=".csv,.json" hidden><select id="mix" hidden></select><small id="recipe"></small>
<hr><label for="size">Penseelgrootte <output id="sizeValue">24</output> px</label><input id="size" type="range" min="2" max="100" value="24">
<label for="angle">Vulhoek <output id="angleValue">25</output>°</label><input id="angle" type="range" min="0" max="90" value="25">
<button id="refine" title="Verdeel elke driehoek in vier">Mesh verfijnen ×4</button><hr>
<div class="row"><h2 style="margin:0 auto 0 0">Lagen</h2><button id="layerAdd" aria-label="Laag toevoegen">+</button></div><div id="layers"></div>
<div id="saved" hidden><hr><h2>Opgeslagen project</h2><a id="download" hidden>Download .meshpaint</a><button id="restore" hidden>Herstelkopie openen</button></div>
</aside></main>
<footer id="status" role="status">Open dit HTML-bestand rechtstreeks in je browser om de editor te gebruiken.</footer>
<script>
(() => {

const $ = id => document.getElementById(id);

    const layer = model.layers[i];
    const row = document.createElement('div');
    row.className = 'row';
    const toggle = document.createElement('button');
    toggle.textContent = layer.visible ? '◉' : '○';
    toggle.title = layer.visible ? 'Laag verbergen' : 'Laag tonen';
    toggle.onclick = () => {
      const previous = layer.visible;
      const apply = value => { layer.visible = value; compose(); };
      apply(!previous);
      record(() => apply(previous), () => apply(!previous));
      layersUI(); draw();
    };

    title.className = 'layer' + (active === i ? ' active' : '');
    title.textContent = layer.name;
    title.title = 'Dubbelklik om de laag te hernoemen';
    title.onclick = () => {
      active = i;
      for (const button of $('layers').querySelectorAll('.layer')) button.classList.toggle('active', button === title);

      const previous = layer.name, next = prompt('Laagnaam', previous)?.trim();

$('layerAdd').onclick = () => {

function edgeKey(a, b, vertexCount) {

const tools = document.querySelectorAll('[data-tool]');

for (const button of tools) button.onclick = () => selectTool(button.dataset.tool);
selectTool(tool);

  const button = document.createElement('button');

setColor($('color').value);
$('color').oninput = () => setColor($('color').value);
for (const key of ['size', 'angle']) $(key).oninput = () => { $(key + 'Value').value = $(key).value; };

async function openFile(file) {

      replaceModel(makeModel(file.name.slice(0, -4), points, faces, [newLayer('Verflaag 1')]));
    } else if (/\.meshpaint$/i.test(file.name)) openProject(JSON.parse(await file.text()));

function download(blob, filename) {

let dbPromise, saveUrl;
function recovery(copy) {

    const request = indexedDB.open('meshpaint-recovery', 1);
    request.onupgradeneeded = () => request.result.createObjectStore('projects');
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
  return dbPromise.then(db => new Promise((resolve, reject) => {
    const tx = db.transaction('projects', copy ? 'readwrite' : 'readonly');
    const store = tx.objectStore('projects');
    const request = copy ? store.put(copy, 'latest') : store.get('latest');
    tx.oncomplete = () => resolve(request.result);
    tx.onabort = () => reject(tx.error);

}
function showRecovery() {

}
$('restore').onclick = async () => {

    const blob = new Blob([JSON.stringify(project)], { type: 'application/json' });

recovery().then(copy => { if (copy) showRecovery(); }).catch(() => {});
const crcTable = Uint32Array.from({ length: 256 }, (_, index) => {
  for (let bit = 0; bit < 8; bit++) index = (index >>> 1) ^ ((index & 1) ? 0xedb88320 : 0);
  return index >>> 0;

function zip(entries) {

    const filename = encoder.encode(path), body = encoder.encode(text);

    crc = (crc ^ 0xffffffff) >>> 0;

    local.setUint32(0, 0x04034b50, true);
    central.setUint32(0, 0x02014b50, true);
    central.setUint16(4, 20, true);
    for (const [header, start] of [[local, 4], [central, 6]]) {
      header.setUint16(start, 20, true);
      header.setUint16(start + 8, 33, true);
      header.setUint32(start + 10, crc, true);
      header.setUint32(start + 14, body.length, true);
      header.setUint32(start + 18, body.length, true);

    new Uint8Array(central.buffer).set(filename, 46);

    directorySize += central.byteLength;

    '<resources><m:colorgroup id="1">'];

  xml.push('</m:colorgroup><object id="2" type="model" pid="1" pindex="0"><mesh><vertices>');

  }

    ['_rels/.rels', '<?xml version="1.0"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Target="/3D/3dmodel.model" Id="rel0" Type="http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel"/></Relationships>'],

function demo() {
  const points = [], faces = [], paint = newLayer('Voorbeeldkleuren');

  const rings = [], segments = 64;
