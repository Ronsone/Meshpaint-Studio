<!doctype html>
<html lang="nl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meshpaint Studio</title>
<style>

on{font-size:10px}header strong{font-size:16px}header button{font-size:11px}}
</style>
<header><strong>Meshpaint <span>Studio</span></strong><button id="open">STL / project openen</button><button id="save">Project opslaan</button><button id="export" class="primary">3MF exporteren</button><input id="file" type="file" accept=".stl,.meshpaint" hidden></header>
<main>
<nav aria-label="Gereedschap">
<button data-tool="brush" title="Penseel (B)">Penseel</button><button data-tool="line" title="Lijn (L)">Lijn</button><button data-tool="curve" title="Curve (C)">Curve</button><button data-tool="wand" title="Toverstaf (W). Shift voegt toe, Alt trekt af.">Toverstaf</button><button data-tool="fill" title="Vullen (G)">Vullen</button><button data-tool="erase" title="Gum (E)">Gum</button><button data-tool="pick" title="Pipet (I)">Pipet</button><button data-tool="orbit" title="Draaien (V)">Draaien</button><hr><button id="undo">Ongedaan</button><button id="redo">Opnieuw</button>
</nav>
<section id="view"><canvas id="mesh" aria-label="Schilderbaar 3D-model"></canvas><canvas id="guide" aria-hidden="true"></canvas><div class="overlay"><strong id="name"></strong><br><small id="count"></small></div><button class="camera" id="camera" title="Rechts slepen om te draaien, scrollen om te zoomen">Weergave herstellen</button></section>
<aside>

<label for="mix">Mengkleuren</label><div class="row"><button id="paletteOpen">Palet importeren</button><button id="example" title="CSV-voorbeeld downloaden">CSV</button></div><input id="paletteFile" type="file" accept=".csv,.json" hidden><select id="mix" hidden></select><small id="recipe"></small>
<hr><label for="shape">Penseelvorm</label><select id="shape"><option value="round">Rond</option><option value="square">Vierkant</option><option value="chisel">Beitel</option></select><div id="rotation" hidden><label for="brushAngle">Draaihoek <output id="brushAngleValue">0</output>°</label><input id="brushAngle" type="range" min="0" max="180" value="0"></div><label for="size">Penseelgrootte <output id="sizeValue">24</output> px</label><input id="size" type="range" min="2" max="100" value="24">
<label for="angle">Vulhoek <output id="angleValue">25</output>°</label><input id="angle" type="range" min="0" max="90" value="25">
<hr><h2>Masker</h2><label for="wandMode">Toverstaf selecteert</label><select id="wandMode"><option value="angle">Verbonden binnen vulhoek</option><option value="connected">Los onderdeel</option><option value="color">Verbonden met dezelfde kleur</option><option value="globalColor">Alle vlakken met dezelfde kleur</option></select>
<label for="maskMode">Selectiebewerking</label><select id="maskMode"><option value="replace">Vervangen</option><option value="add">Toevoegen</option><option value="subtract">Aftrekken</option></select><div class="row controls"><button id="invertMask">Omkeren</button><button id="clearMask">Wissen</button></div><small id="maskCount"></small><hr>
<button id="refine" title="Verdeel elke driehoek in vier">Mesh verfijnen ×4</button><hr>
<div class="row"><h2 style="margin:0 auto 0 0">Lagen</h2><button id="layerAdd" aria-label="Laag toevoegen">+</button></div><div id="layers"></div>
<div id="saved" hidden><hr><h2>Opgeslagen project</h2><a id="download" hidden>Download .meshpaint</a><button id="restore" hidden>Herstelkopie openen</button></div>
</aside></main>
<footer id="status" role="status">Open dit HTML-bestand rechtstreeks in je browser om de editor te gebruiken.</footer>
<script>

const canvas = $('mesh'), guide = $('guide');

const ctx = canvas.getContext('2d');

  $('count').textContent = colors.length.toLocaleString('nl-NL') + ' driehoeken';

function composeFace(face) {

  canvas.height = Math.max(1, Math.round(height * scale));

function resetCamera() {
  yaw = .42; pitch = .14; zoom = 1;
  anchors = [];
  viewChanged = true;

}
function syncHistory() {
  $('undo').disabled = !undo.length;
  $('redo').disabled = !redo.length;
}
function record(before, after) {
  undo.push({ before, after });

}
function replay(from, to, key) {
  if (stroke || !from.length) return;
  const action = from.pop();

$('undo').onclick = () => replay(undo, redo, 'before');
$('redo').onclick = () => replay(redo, undo, 'after');
function layersUI() {
  $('layers').replaceChildren();
  for (let i = model.layers.length - 1; i >= 0; i--) {
    const layer = model.layers[i];
    const row = document.createElement('div');
    row.className = 'row';
    const toggle = document.createElement('button');
    toggle.textContent = layer.visible ? '◉' : '○';
    toggle.title = layer.visible ? 'Laag verbergen' : 'Laag tonen';
    toggle.onclick = () => {
      const previous = layer.visible;
      const apply = value => { layer.visible = value; compose(); };
      apply(!previous);
      record(() => apply(previous), () => apply(!previous));
      layersUI(); draw();
    };
    const title = document.createElement('button');
    title.className = 'layer' + (active === i ? ' active' : '');
    title.textContent = layer.name;
    title.title = 'Dubbelklik om de laag te hernoemen';
    title.onclick = () => {
      active = i;
      for (const button of $('layers').querySelectorAll('.layer')) button.classList.toggle('active', button === title);
    };

      const previous = layer.name, next = prompt('Laagnaam', previous)?.trim();
      if (!next || next === previous) return;
      layer.name = next;
      record(() => { layer.name = previous; }, () => { layer.name = next; });
      layersUI();
    };

    $('layers').append(row);
  }

$('layerAdd').onclick = () => {

  const add = () => { model.layers.push(layer); active = model.layers.length - 1; compose(); };
  const remove = () => { model.layers.pop(); active = previous; compose(); };
  add(); record(remove, add); layersUI(); draw();

function edgeKey(a, b, vertexCount) {
  return Math.min(a, b) * vertexCount + Math.max(a, b);

function connectedFaces(start, mode = 'angle') {

    return matches;
  }
  const { faces, points, normals } = model;
  if (!model.neighbors) {
    const neighbors = Array.from({ length: faces.length / 3 }, () => []);

    for (let i = 0; i < faces.length; i += 3) {
      for (let j = 0; j < 3; j++) {
        const key = edgeKey(faces[i + j], faces[i + (j + 1) % 3], points.length / 3);
        const previous = edges.get(key), face = i / 3;
        if (previous === undefined) edges.set(key, face);

    for (const next of model.neighbors[queue[i]]) {
      if (visited.has(next)) continue;

      const dot = normals[initial] * normals[p] + normals[initial + 1] * normals[p + 1] + normals[initial + 2] * normals[p + 2];

const tools = document.querySelectorAll('[data-tool]');

for (const button of tools) button.onclick = () => selectTool(button.dataset.tool);
selectTool(tool);
function setColor(value) {

for (const color of ['#b095ff', '#f685ab', '#f38167', '#ffc477', '#dafa87', '#8de1c3', '#54d7f2', '#6893ff', '#f4f5ff', '#252836']) {

setColor($('color').value);
$('color').oninput = () => setColor($('color').value);
for (const key of ['size', 'angle', 'brushAngle']) $(key).oninput = () => { $(key + 'Value').value = $(key).value; drawGuide(); };
function locksUI() {
  const selected = parseInt($('color').value.slice(1), 16);
  const locked = lockedColors.has(selected);

  button.textContent = locked ? 'Kleur ontgrendelen' : 'Kleur vergrendelen';
  button.setAttribute('aria-pressed', String(locked));
  list.replaceChildren(new Option('Vergrendelde kleuren (' + lockedColors.size + ')', ''));

$('lockedColors').onchange = () => {

};
$('lockColor').onclick = () => {
  if (stroke) return;
  const color = parseInt($('color').value.slice(1), 16), previous = lockedColors.has(color);
  function apply(locked) {

function maskUI() {
  $('clearMask').disabled = !mask;
  $('invertMask').disabled = !mask;

function changeMask(next) {

$('clearMask').onclick = () => { if (!stroke && mask) changeMask(null); };

  link.href = url; link.download = filename;
  document.body.append(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

);
let dbPromise, saveUrl;
function recovery(copy) {
  dbPromise ??= new Promise((resolve, reject) => {
    const request = indexedDB.open('meshpaint-recovery', 1);
    request.onupgradeneeded = () => request.result.createObjectStore('projects');
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
  return dbPromise.then(db => new Promise((resolve, reject) => {
    const tx = db.transaction('projects', copy ? 'readwrite' : 'readonly');
    const store = tx.objectStore('projects');
    const request = copy ? store.put(copy, 'latest') : store.get('latest');
    tx.oncomplete = () => resolve(request.result);
    tx.onabort = () => reject(tx.error);
  }));
}
function showRecovery() {
  $('saved').hidden = false;
  $('restore').hidden = false;

    await openFile(new File([copy.blob], copy.filename, { type: 'application/json' }));

};

    const filename = safeName(name) + '.meshpaint';

    if (previous) setTimeout(() => URL.revokeObjectURL(previous), 30000);
    const link = $('download');

    $('saved').hidden = false;

recovery().then(copy => { if (copy) showRecovery(); }).catch(() => {});
const crcTable = Uint32Array.from({ length: 256 }, (_, index) => {
  for (let bit = 0; bit < 8; bit++) index = (index >>> 1) ^ ((index & 1) ? 0xedb88320 : 0);
  return index >>> 0;
});
function zip(entries) {
  const encoder = new TextEncoder(), parts = [], directory = [];
  let offset = 0, directorySize = 0;
  for (const [path, text] of entries) {
    const filename = encoder.encode(path);
    const body = typeof text === 'string' ? [encoder.encode(text)] : text.map(chunk => encoder.encode(chunk));
    let crc = 0xffffffff, bodySize = 0;
    for (const chunk of body) {
      bodySize += chunk.length;
      for (const byte of chunk) crc = (crc >>> 8) ^ crcTable[(crc ^ byte) & 255];
    }
    crc = (crc ^ 0xffffffff) >>> 0;
    const local = new DataView(new ArrayBuffer(30 + filename.length));
    const central = new DataView(new ArrayBuffer(46 + filename.length));
    local.setUint32(0, 0x04034b50, true);
    central.setUint32(0, 0x02014b50, true);
    central.setUint16(4, 20, true);
    for (const [header, start] of [[local, 4], [central, 6]]) {
      header.setUint16(start, 20, true);
      header.setUint16(start + 8, 33, true);
      header.setUint32(start + 10, crc, true);
      header.setUint32(start + 14, bodySize, true);
      header.setUint32(start + 18, bodySize, true);
      header.setUint16(start + 22, filename.length, true);
    }
    new Uint8Array(local.buffer).set(filename, 30);
    new Uint8Array(central.buffer).set(filename, 46);
    central.setUint32(42, offset, true);
    parts.push(local.buffer, ...body);
    directory.push(central.buffer);
    offset += local.byteLength + bodySize;
    directorySize += central.byteLength;
  }
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, entries.length, true);
  end.setUint16(10, entries.length, true);
  end.setUint32(12, directorySize, true);
  end.setUint32(16, offset, true);
  return new Blob([...parts, ...directory, end.buffer], { type: 'model/3mf' });
}
function make3MF() {
  const { points, faces } = model;
  const used = [...new Set(colors)], indices = new Map(used.map((color, index) => [color, index]));
  const chunks = [];
  const xml = ['<?xml version="1.0" encoding="UTF-8"?>',
    '<model unit="millimeter" xmlns="http://schemas.microsoft.com/3dmanufacturing/core/2015/02" xmlns:m="http://schemas.microsoft.com/3dmanufacturing/material/2015/02" requiredextensions="m">',
    '<resources><m:colorgroup id="1">'];
  function write(text) {
    xml.push(text);
    if (xml.length >= 16384) {
      chunks.push(xml.join(''));
      xml.length = 0;
    }
  }
  for (const color of used) write('<m:color color="' + hex(color) + 'FF"/>');
  write('</m:colorgroup><object id="2" type="model" pid="1" pindex="0"><mesh><vertices>');
  for (let i = 0; i < points.length; i += 3) {
    write('<vertex x="' + points[i] + '" y="' + points[i + 1] + '" z="' + points[i + 2] + '"/>');
  }
  write('</vertices><triangles>');
  for (let i = 0; i < faces.length; i += 3) {
    const p = indices.get(colors[i / 3]);
    write('<triangle v1="' + faces[i] + '" v2="' + faces[i + 1] + '" v3="' + faces[i + 2] +
      '" pid="1" p1="' + p + '" p2="' + p + '" p3="' + p + '"/>');
  }
  write('</triangles></mesh></object></resources><build><item objectid="2"/></build></model>');
  if (xml.length) chunks.push(xml.join(''));
  return zip([
    ['[Content_Types].xml', '<?xml version="1.0"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="model" ContentType="application/vnd.ms-package.3dmanufacturing-3dmodel+xml"/></Types>'],
    ['_rels/.rels', '<?xml version="1.0"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Target="/3D/3dmodel.model" Id="rel0" Type="http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel"/></Relationships>'],
    ['3D/3dmodel.model', chunks]
  ]);
}
$('export').onclick = () => {

};
function demo() {
  const points = [], faces = [], paint = newLayer('Voorbeeldkleuren');
  const profile = [[13,0],[15,4],[15,8],[20,11],[23,18],[24,28],[24,50],[22,62],[18,72],[12,81],[5,88],[1,90]];
  const rings = [], segments = 64;
  for (let i = 0; i < profile.length - 1; i++) {
    for (let step = 0; step < 6; step++) {
      const t = step / 6;
      rings.push(profile[i].map((value, j) => value + (profile[i + 1][j] - value) * t));
    }
  }
  rings.push(profile.at(-1));
  for (const [radius, height] of rings) {

      const window = x * x + y * y;

      if ((height > 62 && height <= 66) || (height >= 20 && height < 23)) color = 0xffc477;

      const a = i * segments + s, b = i * segments + (s + 1) % segments;
      triangle(a, b, a + segments, color);

    triangle(top, last + s, last + next, 0xf38167);

}
